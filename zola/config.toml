# 網誌正式網址：因為輸出到同位階的 blog，且要以 blog 作為網站根路徑
base_url = "/blog"

# 網誌基本資料
title = "Rust CMS Blog"
description = "Rust、Python 與程式設計技術筆記"
default_language = "zh"

# 輸出到與 zola 專案目錄同位階的 blog
output_dir = "../blog"

# Sass 樣式編譯
compile_sass = true

# 開發時不壓縮，正式上線可改 true
minify_html = false

# 建立搜尋索引（搭配前端 search.js）
# 繁體中文索引需使用以 --features indexing-zh 編譯的 Zola
build_search_index = true

# 建立 Atom Feed
generate_feeds = true
feed_filenames = ["atom.xml"]

# 建立 SiteMap 與 robots.txt
generate_sitemap = true
generate_robots_txt = true

# 分類設定
taxonomies = [
    { name = "tags", feed = true },
    { name = "categories", feed = true }
]

[markdown]
render_emoji = true

# 新版 Zola（Giallo）語法高亮設定
[markdown.highlighting]
theme = "github-dark"

[search]
include_title = true
include_description = true
include_date = false
include_path = false
include_content = true
index_format = "elasticlunr_json"

[extra]
author = "Rust CMS"
enable_search = true
posts_per_page = 10
